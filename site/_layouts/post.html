---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} · {{ page.author }}{% endif %}</p>
  {% if page.tldr %}<p class="tldr"><strong>TL;DR.</strong> {{ page.tldr }}</p>{% endif %}
  {{ content }}
</article>
<p class="back"><a href="{{ '/' | relative_url }}">← All posts</a></p>
