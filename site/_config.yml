title: "Collatz in Lean"
description: "Andrés D'Ambrosio's open attempt to prove the Collatz conjecture, every claim checked by Lean."
author: "Andrés D'Ambrosio"
x_handle: "andresdambrosio"
url: "https://andresdambrosio.github.io"
baseurl: "/Collatz"
repo: "https://github.com/andresdambrosio/Collatz"
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter_opts:
    disable: true
permalink: /:year/:month/:day/:title/
future: true
exclude: [README.md]
defaults:
  - scope: { path: "" }
    values: { lang: en }
  - scope: { path: "es" }
    values: { lang: es }
  - scope: { path: "es", type: posts }
    values: { permalink: "/es/:year/:month/:day/:title/" }
